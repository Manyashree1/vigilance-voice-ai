<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceGuard AI | Deepfake Detector</title>
    <style>
        :root {
            --bg-color: #0a0e17;
            --neon-blue: #00f3ff;
            --neon-red: #ff003c;
            --neon-green: #00ff88;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            width: 900px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 30px;
            text-shadow: 0 0 15px var(--neon-blue);
        }

        .upload-zone {
            border: 2px dashed var(--neon-blue);
            padding: 50px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .upload-zone:hover {
            background: rgba(0, 243, 255, 0.05);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* Scanning Animation */
        .scanner {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue);
            animation: scan 2s infinite ease-in-out;
        }

        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        .result-card {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            font-size: 24px;
            font-weight: bold;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .fraud { background: rgba(255, 0, 60, 0.2); border: 2px solid var(--neon-red); color: var(--neon-red); box-shadow: 0 0 30px var(--neon-red); }
        .safe { background: rgba(0, 255, 136, 0.2); border: 2px solid var(--neon-green); color: var(--neon-green); box-shadow: 0 0 30px var(--neon-green); }

        button {
            background: var(--neon-blue);
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
        }

        .loading-text { display: none; margin-top: 15px; color: var(--neon-blue); }
    </style>
</head>
<body>

<div class="container">
    <h1>Vigilance VoiceGuard AI</h1>
    
    <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="scanner" id="scan-line"></div>
        <p id="upload-text">Click to Upload Video/Audio for Security Scan</p>
        <input type="file" id="file-input" hidden accept="audio/*,video/*">
    </div>

    <div class="loading-text" id="loading">SYSTEM ANALYZING FREQUENCIES...</div>

    <div class="result-card" id="result-box">
        <div id="status">RESULT</div>
        <div id="confidence" style="font-size: 16px; margin-top: 10px;">Confidence: 0%</div>
    </div>

    <button onclick="document.getElementById('file-input').click()">New Scan</button>
</div>

<script>
    const fileInput = document.getElementById('file-input');
    const resultBox = document.getElementById('result-box');
    const scanLine = document.getElementById('scan-line');
    const loading = document.getElementById('loading');
    const statusText = document.getElementById('status');
    const confidenceText = document.getElementById('confidence');

    fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // UI Update: Start Scanning
        document.getElementById('upload-text').innerText = "File Received: " + file.name;
        scanLine.style.display = "block";
        loading.style.display = "block";
        resultBox.style.display = "none";

        // Connect to FastAPI
        const formData = new FormData();
        formData.append("file", file);

        try {
            const response = await fetch("http://127.0.0.1:8000/verify-call", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            // UI Update: Show Results
            setTimeout(() => {
                scanLine.style.display = "none";
                loading.style.display = "none";
                resultBox.style.display = "block";

                if (data.is_fraud) {
                    resultBox.className = "result-card fraud";
                    statusText.innerText = "🚨 DEEPFAKE DETECTED";
                } else {
                    resultBox.className = "result-card safe";
                    statusText.innerText = "✅ HUMAN VOICE VERIFIED";
                }
                confidenceText.innerText = "AI Confidence Score: " + data.confidence;
            }, 2000); // 2 second delay for "cool" effect

        } catch (error) {
            alert("Error: Backend se connection nahi ho paya. Make sure FastAPI is running!");
            scanLine.style.display = "none";
            loading.style.display = "none";
        }
    };
</script>

</body>
</html>
